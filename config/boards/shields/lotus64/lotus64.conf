# Split keyboard configuration
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=y

# UART settings for split
CONFIG_SERIAL=y
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_INTERRUPT=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Disable Bluetooth
CONFIG_BT=n
CONFIG_ZMK_BLE=n

# USB settings
CONFIG_USB=y
CONFIG_ZMK_USB=y

# Enable SPI for nice!view
CONFIG_SPI=y

# Display configuration
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_26=y

# Minimal widgets (no battery since wired, keep output for USB indication)
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y  # Shows "USB" - useful confirmation
CONFIG_ZMK_WIDGET_WPM=y

# Display performance
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
