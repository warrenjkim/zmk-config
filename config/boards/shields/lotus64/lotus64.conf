# Split keyboard configuration
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=y

# UART settings for split
CONFIG_SERIAL=y
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_INTERRUPT=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_POLLING=n
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_ASYNC=n

# Disable Bluetooth
CONFIG_BT=n
CONFIG_ZMK_BLE=n

# USB settings
CONFIG_USB=y
CONFIG_ZMK_USB=y

# Enable SPI for Nice!View
CONFIG_SPI=y

# Enable display subsystem - CRITICAL!
CONFIG_ZMK_DISPLAY=y

# Display widgets
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_WPM=n

# Additional display settings that might help
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

# Memory settings for display buffer
CONFIG_HEAP_MEM_POOL_SIZE=8192
