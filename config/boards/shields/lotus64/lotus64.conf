# Enable split keyboard support
CONFIG_ZMK_SPLIT=y

# Enable wired split instead of BLE
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=y

# Configure UART settings
CONFIG_SERIAL=y

# Select interrupt mode for nRF52 (Nice!Nano v2)
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_INTERRUPT=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_POLLING=n
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_ASYNC=n

# Disable unused Bluetooth features to save resources
CONFIG_BT=n
CONFIG_ZMK_BLE=n

# USB settings
CONFIG_USB=y
CONFIG_ZMK_USB=y
