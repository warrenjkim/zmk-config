# Split keyboard configuration
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=y

# UART settings for split
CONFIG_SERIAL=y
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_INTERRUPT=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_POLLING=n
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_ASYNC=n

# Disable Bluetooth
CONFIG_BT=n
CONFIG_ZMK_BLE=n

# USB settings
CONFIG_USB=y
CONFIG_ZMK_USB=y

# External power management - SUGGESTED FIX
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_EXT_POWER_GENERIC=y

# Soft-off feature - SUGGESTED FIX
CONFIG_ZMK_PM_SOFT_OFF=y

# Enable SPI for Nice!View
CONFIG_SPI=y

# Enable display subsystem
CONFIG_ZMK_DISPLAY=y

# COMPLETELY DISABLE ALL WIDGETS - test with blank display
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_WPM=n

# Display settings - minimal
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_BLANK_ON_SOC_IDLE=n

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10
