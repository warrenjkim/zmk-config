# Split keyboard configuration
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=y

# UART settings for split
CONFIG_SERIAL=y
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_INTERRUPT=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_POLLING=n
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_ASYNC=n

# Disable Bluetooth
CONFIG_BT=n
CONFIG_ZMK_BLE=n

# USB settings
CONFIG_USB=y
CONFIG_ZMK_USB=y

# External power management
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_EXT_POWER_GENERIC=y

# Soft-off feature
CONFIG_ZMK_PM_SOFT_OFF=y

# Enable SPI for Nice!View
CONFIG_SPI=y

# Enable display subsystem
CONFIG_ZMK_DISPLAY=y

# OFFICIAL NICE!VIEW CONFIGURATION - Based on zmk/app/boards/shields/nice_view/README.md
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_26=y

# Enable useful widgets for hardwired dual Nice!View setup
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_WPM=n

# Display settings
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_BLANK_ON_SOC_IDLE=n

# Key scanning debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10
